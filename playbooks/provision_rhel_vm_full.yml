---
- name: Provision RHEL VM with OVN-Localnet Networking
  hosts: localhost
  connection: local
  gather_facts: false

  # Load the vault file (or ensure it is included in your project)
  vars_files:
    - vault_vars.yml

  vars:
    # --- Survey Variables ---
    vm_name: "rhel-prod-vm"
    target_namespace: "default"
    os_choice: "rhel9"
    vm_size: "u1.medium"
    storage_class: "lvms-vg1-immediate"
    ssh_secret_name: "noowens-mac-pub"
    nad_name: "baremetal-network"

    os_prefs:
      rhel8: "rhel.8"
      rhel9: "rhel.9"
      rhel10: "rhel.10"

  tasks:
    - name: Create temporary Kubeconfig file from Vault
      ansible.builtin.copy:
        content: "{{ vault_kubeconfig_content }}"
        dest: "/tmp/kubeconfig_{{ vm_name }}"
        mode: '0600'

    - name: Define VirtualMachine Manifest
      ansible.builtin.set_fact:
        vm_manifest:
          apiVersion: kubevirt.io/v1
          kind: VirtualMachine
          metadata:
            name: "{{ vm_name }}"
            namespace: "{{ target_namespace }}"
          spec:
            runStrategy: Always
            instancetype:
              kind: VirtualMachineClusterInstancetype
              name: "{{ vm_size }}"
            preference:
              kind: VirtualMachineClusterPreference
              name: "{{ os_prefs[os_choice] }}"
            # ... (Rest of manifest remains as provided in your original file)

    - name: Deploy VM to OpenShift
      kubernetes.core.k8s:
        state: present
        definition: "{{ vm_manifest }}"
      register: vm_result
      environment:
        KUBECONFIG: "/tmp/kubeconfig_{{ vm_name }}"

    - name: Remove temporary Kubeconfig
      ansible.builtin.file:
        path: "/tmp/kubeconfig_{{ vm_name }}"
        state: absent
      when: vm_result is defined

    - name: Output Summary
      ansible.builtin.debug:
        msg: "VM {{ vm_name }} created. Attachment to {{ nad_name }} successful."