---
- name: Provision RHEL VM with OVN-Localnet Networking
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    # --- Survey Variables ---
    vm_name: "{{ survey_vm_name }}"
    target_namespace: "default"
    os_choice: "{{ survey_os_choice }}"
    vm_cpu: "{{ survey_vm_cpu | default(1) | int }}"
    vm_memory: "{{ survey_vm_memory | default('4Gi') }}"
    storage_class: "lvms-vg1-immediate"
    ssh_secret_name: "my-mac-pub"
    nad_name: "baremetal-network"
    sv_host: "{{ survey_url }}"
    sv_token: "{{ survey_token }}"
    automation_user: "norman"

  tasks:
    - name: Define VirtualMachine Manifest
      ansible.builtin.set_fact:
        vm_manifest: "{{ vm_manifest_raw | from_yaml }}"
      vars:
        cloud_init_userdata: |
          #cloud-config
          ssh_pwauth: False
          users:
            - default
            - name: {{ automation_user }}
              shell: /bin/bash
              ssh_authorized_keys:
                - {{ automation_ssh_public_key }}
          write_files:
            - path: /etc/sudoers.d/{{ automation_user }}
              content: '{{ automation_user }} ALL=(ALL) NOPASSWD:ALL'
              permissions: '0440'
        vm_manifest_raw: |
          apiVersion: kubevirt.io/v1
          kind: VirtualMachine
          metadata:
            name: "{{ vm_name }}"
            namespace: "{{ target_namespace }}"
          spec:
            runStrategy: Always
            template:
              spec:
                accessCredentials:
                  - sshPublicKey:
                      propagationMethod:
                        noCloud: {}
                      source:
                        secret:
                          secretName: "{{ ssh_secret_name }}"
                domain:
                  cpu:
                    cores: {{ vm_cpu | int }}
                  memory:
                    guest: "{{ vm_memory }}"
                  devices:
                    disks:
                      - name: rootdisk
                        disk: {}
                    interfaces:
                      - name: default
                        masquerade: {}
                      - name: bridge-net
                        bridge: {}
                networks:
                  - name: default
                    pod: {}
                  - name: bridge-net
                    multus:
                      networkName: "{{ nad_name }}"
                volumes:
                  - name: rootdisk
                    dataVolume:
                      name: "{{ vm_name }}-volume"
                  - name: cloudinitdisk
                    cloudInitNoCloud:
                      userData: {{ cloud_init_userdata | to_json }}
            dataVolumeTemplates:
              - metadata:
                  name: "{{ vm_name }}-volume"
                spec:
                  sourceRef:
                    kind: DataSource
                    name: "{{ os_choice }}" #Matches 'rhel8' or 'rhel9' or 'rhel10'
                    namespace: openshift-virtualization-os-images
                  storage:
                    resources:
                      requests:
                        storage: 30Gi
                    storageClassName: "{{ storage_class }}"

    - name: Deploy VM to OpenShift
      kubernetes.core.k8s:
        state: present
        definition: "{{ vm_manifest }}"
        # --- Connection Parameters ---
        host: "{{ sv_host }}"
        api_key: "{{ sv_token }}"
        verify_ssl: false  # Use false if using the internal service address with self-signed certs
      register: vm_result

    - name: Output Summary
      ansible.builtin.debug:
        msg: "VM {{ vm_name }} deployed to {{ target_namespace }}. Attachment to {{ nad_name }} successful using API Token"
