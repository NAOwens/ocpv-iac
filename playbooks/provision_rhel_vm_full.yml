---
- name: Provision RHEL VM with OVN-Localnet Networking
  hosts: localhost
  connection: local
  gather_facts: false

  # Explicitly point to the vault file you moved
  vars_files:
    - group_vars/all/vault_vars.yml

  vars:
    # --- Survey Variables ---
    vm_name: "{{ survey_vm_name }}"
    target_namespace: "default"
    os_choice: "{{ survey_os_choice }}"
    vm_size: "u1.small"
    storage_class: "lvms-vg1-immediate"
    ssh_secret_name: "noowens-mac-pub"
    nad_name: "baremetal-network"
    sv_host: "{{ survey_url }}"
    sv_token: "{{ survey_token }}"

    os_prefs:
      rhel8: "rhel.8"
      rhel9: "rhel.9"
      rhel10: "rhel.10"

  tasks:
#    - name: Create temporary Kubeconfig file from Vault
#      ansible.builtin.copy:
#        content: "{{ vault_kubeconfig_content }}"
#        dest: "/tmp/kubeconfig_{{ vm_name }}"
#        mode: '0600'

    - name: Define VirtualMachine Manifest
      ansible.builtin.set_fact:
        vm_manifest:
          apiVersion: kubevirt.io/v1
          kind: VirtualMachine
          metadata:
            name: "{{ vm_name }}"
            namespace: "{{ target_namespace }}"
          spec:
            runStrategy: Always
            instancetype:
              kind: VirtualMachineClusterInstancetype
              name: "{{ vm_size }}"
            preference:
              kind: VirtualMachineClusterPreference
              name: "{{ os_prefs[os_choice] }}"
            template:
              spec:
                domain:
                  devices:
                    disks:
                      - name: rootdisk
                        disk: {}
                    interfaces:
                      - name: default
                        masquerade: {}
                      - name: bridge-net
                        bridge: {}
                networks:
                  - name: default
                    pod: {}
                  - name: bridge-net
                    multus:
                      networkName: "{{ nad_name }}"
                volumes:
                  - name: rootdisk
                    dataVolume:
                      name: "{{ vm_name }}"

    - name: Deploy VM to OpenShift
      kubernetes.core.k8s:
        state: present
        definition: "{{ vm_manifest }}"
        # --- Connection Parameters ---
        host: "{{ sv_host }}"
        api_key: "{{ sv_token }}"
        verify_ssl: false  # Use false if using the internal service address with self-signed certs
      register: vm_result
#      environment:
#        KUBECONFIG: "/tmp/kubeconfig_{{ vm_name }}"

#    - name: Remove temporary Kubeconfig
#      ansible.builtin.file:
#        path: "/tmp/kubeconfig_{{ vm_name }}"
#        state: absent
#      when: vm_result is defined

    - name: Output Summary
      ansible.builtin.debug:
        msg: "VM {{ vm_name }} deployed to {{ target_namespace }}. Attachment to {{ nad_name }} successful using API Token"