---
- name: Resize VM CPU and Memory in OpenShift Virtualization
  hosts: localhost
  connection: local
  gather_facts: false

  collections:
    - kubernetes.core

  vars:
    vm_name: "{{ survey_vm_name }}"
    vm_namespace: "{{ survey_namespace }}"
    vm_cpu_cores: "{{ survey_cpu_cores | int }}"
    vm_cpu_sockets: "{{ survey_cpu_sockets | default(1) | int }}"
    vm_cpu_threads: "{{ survey_cpu_threads | default(1) | int }}"
    # Kubernetes quantity notation: e.g. "4Gi", "2048Mi"
    vm_memory: "{{ survey_memory }}"
    # Checkbox survey field: stop/start the VM to apply changes
    restart_vm: "{{ survey_restart_vm | default(true) | bool }}"
    sv_host: "{{ survey_url }}"
    sv_token: "{{ survey_token }}"

  pre_tasks:
    - name: Validate required survey variables
      ansible.builtin.assert:
        that:
          - vm_name | length > 0
          - vm_namespace | length > 0
          - vm_cpu_cores | int > 0
          - vm_memory | length > 0
          - sv_host | length > 0
          - sv_token | length > 0
        fail_msg: "One or more required survey variables are missing or empty"

  tasks:
    - name: Get current VM definition
      kubernetes.core.k8s_info:
        host: "{{ sv_host }}"
        api_key: "{{ sv_token }}"
        verify_ssl: false
        api_version: kubevirt.io/v1
        kind: VirtualMachine
        name: "{{ vm_name }}"
        namespace: "{{ vm_namespace }}"
      register: vm_info

    - name: Assert VM exists
      ansible.builtin.assert:
        that:
          - vm_info.resources | length > 0
        fail_msg: "VM '{{ vm_name }}' not found in namespace '{{ vm_namespace }}'"

    - name: Set VM state facts
      ansible.builtin.set_fact:
        vm_run_strategy: "{{ vm_info.resources[0].spec.runStrategy | default('Always') }}"
        vm_has_instancetype: "{{ vm_info.resources[0].spec.instancetype is defined }}"
        vm_has_preference: "{{ vm_info.resources[0].spec.preference is defined }}"

    - name: Warn that instancetype will be replaced with explicit sizing
      ansible.builtin.debug:
        msg: >-
          VM '{{ vm_name }}' currently uses instancetype
          '{{ vm_info.resources[0].spec.instancetype.name }}'. Removing instancetype
          reference and setting explicit CPU/memory instead.
      when: vm_has_instancetype | bool

    - name: Stop VM before resizing
      kubernetes.core.k8s:
        host: "{{ sv_host }}"
        api_key: "{{ sv_token }}"
        verify_ssl: false
        api_version: kubevirt.io/v1
        kind: VirtualMachine
        name: "{{ vm_name }}"
        namespace: "{{ vm_namespace }}"
        definition:
          spec:
            runStrategy: Halted
        merge_type: merge
      when:
        - restart_vm | bool
        - vm_run_strategy != 'Halted'

    - name: Wait for VMI to terminate (VM fully stopped)
      kubernetes.core.k8s_info:
        host: "{{ sv_host }}"
        api_key: "{{ sv_token }}"
        verify_ssl: false
        api_version: kubevirt.io/v1
        kind: VirtualMachineInstance
        name: "{{ vm_name }}"
        namespace: "{{ vm_namespace }}"
      register: vmi_status
      until: vmi_status.resources | length == 0
      retries: 30
      delay: 10
      when:
        - restart_vm | bool
        - vm_run_strategy != 'Halted'

    - name: Remove instancetype reference (incompatible with explicit CPU/memory)
      kubernetes.core.k8s_json_patch:
        host: "{{ sv_host }}"
        api_key: "{{ sv_token }}"
        verify_ssl: false
        api_version: kubevirt.io/v1
        kind: VirtualMachine
        name: "{{ vm_name }}"
        namespace: "{{ vm_namespace }}"
        patch:
          - op: remove
            path: /spec/instancetype
      when: vm_has_instancetype | bool

    - name: Remove preference reference
      kubernetes.core.k8s_json_patch:
        host: "{{ sv_host }}"
        api_key: "{{ sv_token }}"
        verify_ssl: false
        api_version: kubevirt.io/v1
        kind: VirtualMachine
        name: "{{ vm_name }}"
        namespace: "{{ vm_namespace }}"
        patch:
          - op: remove
            path: /spec/preference
      when: vm_has_preference | bool

    - name: Patch VM with explicit CPU and memory
      kubernetes.core.k8s:
        host: "{{ sv_host }}"
        api_key: "{{ sv_token }}"
        verify_ssl: false
        api_version: kubevirt.io/v1
        kind: VirtualMachine
        name: "{{ vm_name }}"
        namespace: "{{ vm_namespace }}"
        definition:
          spec:
            template:
              spec:
                domain:
                  cpu:
                    cores: "{{ vm_cpu_cores | int }}"
                    sockets: "{{ vm_cpu_sockets | int }}"
                    threads: "{{ vm_cpu_threads | int }}"
                  memory:
                    guest: "{{ vm_memory }}"
                  resources:
                    requests:
                      memory: "{{ vm_memory }}"
        merge_type: merge

    - name: Start VM after resizing
      kubernetes.core.k8s:
        host: "{{ sv_host }}"
        api_key: "{{ sv_token }}"
        verify_ssl: false
        api_version: kubevirt.io/v1
        kind: VirtualMachine
        name: "{{ vm_name }}"
        namespace: "{{ vm_namespace }}"
        definition:
          spec:
            runStrategy: Always
        merge_type: merge
      when:
        - restart_vm | bool
        - vm_run_strategy != 'Halted'

    - name: Wait for VM to reach Running phase
      kubernetes.core.k8s_info:
        host: "{{ sv_host }}"
        api_key: "{{ sv_token }}"
        verify_ssl: false
        api_version: kubevirt.io/v1
        kind: VirtualMachineInstance
        name: "{{ vm_name }}"
        namespace: "{{ vm_namespace }}"
      register: vmi_running
      until: >
        vmi_running.resources | length > 0 and
        vmi_running.resources[0].status.phase | default('') == 'Running'
      retries: 60
      delay: 10
      when:
        - restart_vm | bool
        - vm_run_strategy != 'Halted'

  post_tasks:
    - name: Resize summary
      ansible.builtin.debug:
        msg:
          - "VM:     {{ vm_name }} (namespace: {{ vm_namespace }})"
          - "CPU:    {{ vm_cpu_sockets }} socket(s) x {{ vm_cpu_cores }} core(s) x {{ vm_cpu_threads }} thread(s)"
          - "Memory: {{ vm_memory }}"
          - "Restarted: {{ (restart_vm | bool) and (vm_run_strategy != 'Halted') }}"
